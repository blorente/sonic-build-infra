# Prefer the official Debian CDN for locked package archives. Keep the original
# snapshot for versions no longer on the mirror; Bazel still verifies the lock's
# SHA256 for either URL. Archive indexes and other repositories are unchanged.
rewrite (snapshot\.debian\.org/archive/debian/[0-9]{8}T[0-9]{6}Z/)(pool/.*\.deb) https://deb.debian.org/debian/$2
rewrite (snapshot\.debian\.org/archive/debian/[0-9]{8}T[0-9]{6}Z/)(pool/.*\.deb) https://$1$2
